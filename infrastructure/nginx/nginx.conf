# Real gap found and fixed 2026-09-07: docker-compose.yml's `nginx`
# service has bind-mounted `../nginx/nginx.conf` since this file's
# initial scaffold, but the file itself was never actually written — a
# real `docker compose up` would have failed to start `nginx` at all
# (bind-mounting a nonexistent host path). Docker itself still can't run
# on this dev machine (see docs/deployment.md), so this is written and
# reasoned through by hand against the actual compose topology, the same
# way the three Dockerfiles were — not run-and-verified here, but no
# longer just a dangling reference either.
#
# Topology (docs/deployment.md "Production topology", spec §6/§78): one
# nginx in front of `web` (Next.js, the full public site + admin UI) and
# `api` (the real REST backend under `/v1/*` plus `/health`/`/ready`).
# `apps/web`'s own `/api/admin/*` routes (the same-origin proxy routes to
# `apps/api` — see e.g. apps/web/src/app/api/admin/login/route.ts) are
# served BY `web` itself and must NOT be routed to `api` here; only the
# real `apps/api` surface (`/v1/*`, `/health`, `/ready`) does.
#
# `DOMAIN.COM` below is the same literal placeholder convention already
# used in `.env.example` (`PUBLIC_DOMAIN=DOMAIN.COM`) — replace both the
# `server_name` and the certbot cert path with the real domain before
# deploying; nginx does not do env-var substitution on a plain mounted
# `nginx.conf` (only `/etc/nginx/templates/*.template` files do, and this
# is intentionally a real .conf, not a template, to match how the compose
# file already mounts it).

user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off; # don't advertise the nginx version to the internet

  server {
    listen 80;
    server_name DOMAIN.COM www.DOMAIN.COM;

    # certbot webroot mode (docs/deployment.md "standard certbot for
    # TLS") — matches docker-compose.yml's certbot_webroot volume.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Everything else on plain HTTP redirects to HTTPS — this site never
    # serves real content over an unencrypted connection.
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name DOMAIN.COM www.DOMAIN.COM;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN.COM/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # `X-Forwarded-For: $remote_addr` below (not a client-supplied value)
    # is what `apps/api`'s `app.set("trust proxy", 1)` actually expects:
    # trusting exactly one hop resolves `req.ip` to the real client only
    # because nginx is the sole proxy in front of api/web — this stays
    # correct only as long as that stays true.

    # The real apps/api surface — everything else falls through to web.
    # `/health`/`/ready` are exact matches (`app.get("/health", ...)` has
    # no sub-paths); `/v1/` is a real prefix since every real endpoint
    # lives under it. nginx picks the longest matching prefix location
    # regardless of declaration order for plain (non-regex) locations
    # like these, so `/v1/` and the exact matches below all correctly
    # win over the catch-all `/` for their own paths.
    location = /health {
      proxy_pass http://api:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ready {
      proxy_pass http://api:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
      proxy_pass http://api:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # apps/web — the full public site, the admin UI, and apps/web's own
    # same-origin /api/admin/* proxy routes (NOT part of apps/api's real
    # /v1/* surface above, even though the path also starts with /api).
    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Next.js dev/HMR isn't relevant in production, but WebSocket
      # upgrade support costs nothing to keep here and some Next.js
      # features (e.g. certain streaming responses) benefit from it.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
